<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10231f"><title>PARTVISION</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:#14231f;font:16px/1.5 system-ui,sans-serif}.top{background:#10231f;color:white;padding:16px max(18px,calc((100vw - 960px)/2));font-weight:850;letter-spacing:.1em}.top b{color:#d6f26c}.wrap{max-width:960px;margin:auto;padding:25px 18px 50px}h1{font-size:clamp(1.7rem,5vw,2.3rem);line-height:1.15;margin:0 0 7px}.intro{color:#65736d;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid #dce5df;border-radius:17px;padding:17px}h2{font-size:1.05rem;margin:0 0 13px}.preview{min-height:180px;background:#f7faf7;border:1.5px dashed #a9bcb0;border-radius:14px;display:grid;place-items:center;overflow:hidden;color:#65736d;text-align:center;padding:14px}.preview img{width:100%;max-height:340px;object-fit:contain}.buttons{display:flex;gap:9px;margin-top:10px}.pick,.go{min-height:48px;border-radius:11px;border:1px solid #dce5df;background:white;color:#14231f;display:flex;justify-content:center;align-items:center;flex:1;font-weight:700;cursor:pointer}.pick input{display:none}.go{width:100%;margin-top:14px;background:#156b4e;color:white;border:0;font-size:1rem}.go:disabled{opacity:.55}label.note{display:block;font-weight:700;margin:16px 0 6px}textarea{width:100%;min-height:80px;border:1px solid #dce5df;border-radius:11px;padding:11px;font:inherit}#notice{display:none;margin-top:11px;padding:10px;background:#fff1e7;border-radius:9px;color:#743b17}#notice.show{display:block}.empty{min-height:170px;display:grid;place-items:center;text-align:center;color:#65736d}.decision{padding:14px;border-radius:12px;margin-bottom:11px;background:#fff5db}.go-state{background:#e4f5e9;color:#145b35}.no-state{background:#fdeaea;color:#8e2626}.decision strong{font-size:1.6rem}.section{border:1px solid #dce5df;border-radius:11px;padding:11px;margin-top:8px}.section h3{margin:0 0 5px;font-size:.9rem;text-transform:capitalize}.section p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:680px){.grid{grid-template-columns:1fr}.wrap{padding-top:18px}.empty{min-height:110px}.card{padding:14px}}</style></head><body><header class="top">PART<b>VISION</b></header><main class="wrap"><h1>Periksa komponen dengan foto</h1><div class="intro">Ambil foto atau pilih dari galeri untuk memulai analisis.</div><div class="grid"><section class="card"><h2>1. Foto &amp; catatan</h2><div class="preview" id="preview">📷　Pratinjau foto komponen</div><div class="buttons"><label class="pick">📸 Kamera<input id="camera" type="file" accept="image/*" capture="environment"></label><label class="pick">🖼️ Galeri<input id="gallery" type="file" accept="image/*"></label></div><label class="note" for="notes">Catatan pemeriksaan (opsional)</label><textarea id="notes" maxlength="2000" placeholder="Catat kondisi atau gejala komponen…"></textarea><button class="go" id="run" disabled>Analisis foto</button><div id="notice" role="alert"></div></section><section class="card"><h2>2. Hasil pemeriksaan</h2><div class="empty" id="empty">Hasil GO / NO GO dan rincian muncul di sini.</div><div id="result"></div></section></div></main><script>let photo=null;const $=s=>document.querySelector(s),notice=$("#notice"),run=$("#run");function pick(f){if(!f)return;if(!f.type.startsWith("image/"))return fail("Pilih file gambar.");if(f.size>15*1024*1024)return fail("Ukuran maksimal 15 MB.");photo=f;const i=document.createElement("img");i.src=URL.createObjectURL(f);i.alt="Pratinjau komponen";$("#preview").replaceChildren(i);run.disabled=false;notice.classList.remove("show")}function fail(t){notice.textContent=t;notice.classList.add("show")}$("#camera").onchange=e=>pick(e.target.files[0]);$("#gallery").onchange=e=>pick(e.target.files[0]);function show(out){const rows=Object.entries(out||{}).filter(([,v])=>v!==null&&v!==""),txt=rows.map(([k,v])=>k+" "+(typeof v==="string"?v:JSON.stringify(v))).join(" "),d=rows.find(([k])=>/decision|status|keputusan/i.test(k)),s=String(d?d[1]:txt),m=s.match(/NO\s*GO|NOGO|\bGO\b/i),state=m?(/NO\s*GO|NOGO/i.test(m[0])?"NO GO":"GO"):"HASIL";$("#empty").style.display="none";const b=document.createElement("div");b.className="decision "+(state==="GO"?"go-state":state==="NO GO"?"no-state":"");const strong=document.createElement("strong");strong.textContent=state;b.append(strong);const hint=document.createElement("div");hint.textContent=state==="HASIL"?"Status tidak terbaca jelas di keluaran workflow.":"Tinjau rincian analisis sebelum tindakan.";b.append(hint);$("#result").replaceChildren(b);for(const [k,v] of rows){const a=document.createElement("article"),h=document.createElement("h3"),p=document.createElement("p");a.className="section";h.textContent=k.replace(/[_-]/g," ");p.textContent=typeof v==="string"?v:JSON.stringify(v,null,2);a.append(h,p);$("#result").append(a)}}run.onclick=async()=>{if(!photo)return;run.disabled=true;run.textContent="Menganalisis…";notice.classList.remove("show");try{const f=new FormData();f.append("image",photo,photo.name||"photo.jpg");f.append("notes",$("#notes").value);const r=await fetch("/api/analyze",{method:"POST",body:f}),d=await r.json();if(!r.ok)throw Error(d.error||"Analisis gagal.");show(d.outputs)}catch(e){fail(e.message)}finally{run.disabled=!photo;run.textContent="Analisis foto"}};</script></body></html>
